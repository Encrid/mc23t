[[case]]
name = "a project that states no targets"
run = ["{python}", "{root}/.toolchain/tools/workflows.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\n" }
claims = { status = 1, line = ["workflows.py: .toolchain/project.toml: write the targets of the project in [project] targets"] }
false = { files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-linux-gnu\"]\n" } }

[[case]]
name = "a target that the toolchain does not have"
run = ["{python}", "{root}/.toolchain/tools/workflows.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-linux-gnu\", \"riscv64-linux-gnu\"]\n" }
claims = { status = 1, line = ["workflows.py: [project] targets: riscv64-linux-gnu is not a target of the toolchain"] }
false = { files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-linux-gnu\"]\n" } }

[[case]]
name = "a target named 2 times"
run = ["{python}", "{root}/.toolchain/tools/workflows.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-linux-gnu\", \"x86_64-linux-gnu\"]\n" }
claims = { status = 1, line = ["workflows.py: [project] targets: x86_64-linux-gnu comes 2 times"] }
false = { files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-linux-gnu\"]\n" } }

[[case]]
name = "a build for a target outside the list of the project"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{case}/p", "--out", "{case}/out", "--target", "aarch64-macos"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-windows-gnu\", \"x86_64-linux-gnu\"]\n" }
claims = { status = 1, line = ["build.py: no target aarch64-macos; the targets: x86_64-windows-gnu x86_64-linux-gnu"] }
false = { files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-windows-gnu\", \"x86_64-linux-gnu\", \"aarch64-macos\"]\n" } }

[[case]]
name = "a matrix with a target outside the list of the project"
run = ["{python}", "{root}/.toolchain/tools/workflows.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-windows-gnu\", \"x86_64-linux-gnu\"]\n", "{case}/p/.github/workflows/ci.yml" = "jobs:\n  check:\n    strategy:\n      matrix:\n        include:\n          - target: x86_64-linux-gnu\n          - target: x86_64-windows-gnu\n          - target: aarch64-macos\n" }
claims = { status = 1, line = [".github/workflows/ci.yml: aarch64-macos is not a host of the project"] }
false = { files = { "{case}/p/.github/workflows/ci.yml" = "jobs:\n  check:\n    strategy:\n      matrix:\n        include:\n          - target: x86_64-linux-gnu\n          - target: x86_64-windows-gnu\n" } }

[[case]]
name = "the matrix of toolchain.yml names each target of the toolchain"
run = ["{python}", "{root}/.toolchain/tools/workflows.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-windows-gnu\", \"x86_64-linux-gnu\"]\n", "{case}/p/.github/workflows/toolchain.yml" = "jobs:\n  toolchain:\n    strategy:\n      matrix:\n        include:\n          - target: x86_64-linux-gnu\n          - target: aarch64-linux-gnu\n          - target: aarch64-macos\n          - target: x86_64-macos\n          - target: x86_64-windows-gnu\n          - target: aarch64-windows-gnu\n" }
claims = { status = 0, line = ["no fault in 1 workflows"] }
false = { files = { "{case}/p/.github/workflows/toolchain.yml" = "jobs:\n  toolchain:\n    strategy:\n      matrix:\n        include:\n          - target: x86_64-linux-gnu\n          - target: x86_64-windows-gnu\n" } }
