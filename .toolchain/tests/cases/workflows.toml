[[case]]
name = "a workflow with no matrix"
run = ["{python}", "{root}/.toolchain/tools/workflows.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\ntargets = [\"x86_64-linux-gnu\", \"aarch64-linux-gnu\", \"aarch64-macos\", \"x86_64-macos\", \"x86_64-windows-gnu\", \"aarch64-windows-gnu\"]\n", "{case}/p/.github/workflows/cla.yml" = "name: cla\non:\n  pull_request_target:\n" }
claims = { status = 0, line = ["no fault in 1 workflows"] }
false = { files = { "{case}/p/.github/workflows/cla.yml" = "name: cla\njobs:\n  cla:\n    strategy:\n      matrix:\n        include:\n          - target: x86_64-linux-gnu\n" } }
