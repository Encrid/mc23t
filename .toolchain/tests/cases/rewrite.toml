[[case]]
name = "a syntax tree that ends too soon is not JSON"
run = ["{python}", "-c", "import sys; from pathlib import Path; sys.path.insert(0, sys.argv[1]); import rewrite; rewrite.CHUNK = 100\ntry:\n    print(len(rewrite.parsed(sys.argv[2], Path('/r'))['inner']), 'nodes')\nexcept ValueError:\n    print('the tree ends too soon')", "{root}/.toolchain/tools", "{case}/tree.json"]
claims = { status = 0, line = ["the tree ends too soon"] }

[case.files]
"{case}/tree.json" = '''
{"id":"0x1","kind":"TranslationUnitDecl","loc":{},"range":{"begin":{},"end":{}},"inner":[
{"id":"0x2","kind":"TypedefDecl","loc":{},"range":{"begin":{},"end":{}},"isImplicit":true,"name":"__int128_t","type":{"qualType":"__int128"}},
{"id":"0x6","kind":"FunctionDecl","loc":{"offset":24,"file":"/r/src/a.c","line":2,"col":5,"tokLen":2},"range":{"begin":{"offset":20,"col":1,"tokLen":3},"end":{"offset":60,"line":5,"col":1,"tokLen":1}},"name":"go","type":{"qualType":"int (void)"}}
'''

