[[case]]
name = "a source of a part names the groups of that part only"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/a/x.c\n" }
claims = { status = 0, line = ["--group a/a"] }
false = { files = { "{case}/changed.txt" = "src/b/y.c\n" } }

[[case]]
name = "a nested folder names the groups of its own part"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/a/deep/x.c\n" }
claims = { status = 0, line = ["--group a/deep/deep"] }
false = { files = { "{case}/changed.txt" = "src/a/x.c\n" } }

[[case]]
name = "the config file of a part names the groups of the part"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = ".toolchain/config/c.toml\n" }
claims = { status = 0, line = ["--group c/c"] }
false = { files = { "{case}/changed.txt" = ".toolchain/config/checks.toml\n" } }

[[case]]
name = "a case file names its own group"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "tests/cases/b/b.toml\n" }
claims = { status = 0, line = ["--group b/b"] }
false = { files = { "{case}/changed.txt" = "tests/cases/all.toml\n" } }

[[case]]
name = "a group of the whole does not run for a changed source"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/b/y.c\n" }
claims = { status = 0, line = ["--group b/b --group b/more"] }
false = { files = { "{case}/changed.txt" = ".toolchain/tools/build.py\n" } }

[[case]]
name = "a group names the code that it tests"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/grouped", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/store/a.c\ntests/store/main.c\n" }
claims = { status = 0, line = ["--group store"] }
false = { files = { "{case}/changed.txt" = "tests/cases/whole.toml\n" } }

[[case]]
name = "a project of one piece names each group for a changed source"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/mono", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/x.c\n.toolchain/config/a.toml\n" }
claims = { status = 0, line = ["--group one --group two"] }
false = { files = { "{case}/changed.txt" = "readme.md\n" } }

[[case]]
name = "a file of the toolchain names the groups of the whole"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = ".toolchain/tools/build.py\n.toolchain/toolchain.toml\n" }
claims = { status = 0, line = ["--group all"] }
false = { files = { "{case}/changed.txt" = ".toolchain/docs/build.py.md\n" } }

[[case]]
name = "a file of the toolchain names no group in a project with no group of the whole"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/mono", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = ".toolchain/tools/build.py\nproject.py\n" }
claims = { status = 0, matches_not = ["."] }
false = { files = { "{case}/changed.txt" = "src/x.c\n" } }

[[case]]
name = "a document and a workflow name no group"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "readme.md\ndocs/usage/c.md\ndocs/intern/b/y.c.md\n.github/workflows/ci.yml\n.toolchain/docs/build.py.md\n" }
claims = { status = 0, matches_not = ["."] }
false = { files = { "{case}/changed.txt" = "readme.md\nsrc/b/y.c\n" } }

[[case]]
name = "a pull request into main names the groups of the whole"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "main"]
files = { "{case}/changed.txt" = "src/b/y.c\n" }
claims = { status = 0, line = ["--group all"] }
false = { run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"] }

[[case]]
name = "a pull request into main names no group in a project with no group of the whole"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/mono", "--changed", "{case}/changed.txt", "--into", "main"]
files = { "{case}/changed.txt" = "src/x.c\n" }
claims = { status = 0, matches_not = ["."] }
false = { run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/mono", "--changed", "{case}/changed.txt", "--into", "dev"] }

[[case]]
name = "a project with no case group names nothing"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/plain", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/b/y.c\n" }
claims = { status = 0, matches_not = ["."] }
false = { run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"] }

[[case]]
name = "an empty list names nothing"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "" }
claims = { status = 0, matches_not = ["."] }
false = { files = { "{case}/changed.txt" = "src/b/y.c\n" } }

[[case]]
name = "a source that no group tests stops the tool"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/owned", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/y/a.c\n" }
claims = { status = 1, line = ["scope.py: src/y/a.c: no case group tests this file"] }
false = { files = { "{case}/changed.txt" = "src/x/a.c\n" } }

[[case]]
name = "a code that is no list of patterns"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/miscoded", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/x/a.c\n" }
claims = { status = 1, line = ["scope.py: tests/cases/x.toml: code is a list of patterns"] }
false = { run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/owned", "--changed", "{case}/changed.txt", "--into", "dev"] }

[[case]]
name = "a whole that is not true or false"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/miswhole", "--changed", "{case}/changed.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/x/a.c\n" }
claims = { status = 1, line = ["scope.py: tests/cases/x.toml: whole is true or false"] }
false = { run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/mono", "--changed", "{case}/changed.txt", "--into", "dev"] }

[[case]]
name = "a list that is not there stops the tool"
run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/gone.txt", "--into", "dev"]
files = { "{case}/changed.txt" = "src/b/y.c\n" }
claims = { status_not = 0, has = ["cannot read the list"] }
false = { run = ["{python}", "{root}/.toolchain/tools/scope.py", "--root", "{root}/.toolchain/tests/data/scope/parted", "--changed", "{case}/changed.txt", "--into", "dev"] }
