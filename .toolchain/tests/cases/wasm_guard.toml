[[case]]
name = "a file that is not a wasm module"
run = ["{python}", "{root}/.toolchain/tools/wasm_guard.py", "{case}/m.wasm"]
files = { "{case}/m.wasm" = "text" }
claims = { status = 1, has = ["is refused: it is not a wasm module"] }
false = { files = { "{case}/m.wasm" = "\u0000asm\u0001\u0000\u0000\u0000" } }

[[case]]
name = "a module that imports a memory"
run = ["{python}", "{root}/.toolchain/tools/wasm_guard.py", "{case}/m.wasm"]
files = { "{case}/m.wasm" = "\u0000asm\u0001\u0000\u0000\u0000\u0002\u0008\u0001\u0001m\u0001s\u0002\u0000\u0001" }
claims = { status = 1, has = ["is refused: it imports the memory 'm.s'; a module reaches shared data only through the accessors"] }
false = { files = { "{case}/m.wasm" = "\u0000asm\u0001\u0000\u0000\u0000\u0002\u0007\u0001\u0001m\u0001s\u0000\u0000" } }

[[case]]
name = "a module that imports a global"
run = ["{python}", "{root}/.toolchain/tools/wasm_guard.py", "{case}/m.wasm"]
files = { "{case}/m.wasm" = "\u0000asm\u0001\u0000\u0000\u0000\u0002\u0008\u0001\u0001m\u0001g\u0003\u007f\u0000" }
claims = { status = 1, has = ["is refused: it imports the global 'm.g'; a module imports no global"] }
false = { files = { "{case}/m.wasm" = "\u0000asm\u0001\u0000\u0000\u0000\u0002\u0007\u0001\u0001m\u0001g\u0000\u0000" } }

[[case]]
