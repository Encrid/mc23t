[[case]]
name = "the documents of this project"
run = ["{python}", "{root}/.toolchain/tools/dup.py", "--root", "{case}"]
claims = { status = 0, matches = ["no fault in [1-9][0-9]* documents"] }
false = { files = { "{case}/docs/a.md" = "# a\n\nThe false variant changes the command or its input.\n" } }

[case.folders]
"{case}" = ["readme.md"]
"{case}/.toolchain" = [".toolchain/project.toml"]
"{case}/.toolchain/config" = [".toolchain/config/checks.toml"]
"{case}/docs/contributing" = ["docs/contributing/*.md"]
"{case}/.toolchain/docs" = [".toolchain/docs/*.md"]
