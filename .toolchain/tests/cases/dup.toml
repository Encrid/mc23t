[[case]]
name = "a passage that an exception excuses"
run = ["{python}", "{root}/.toolchain/tools/dup.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[project]\ntargets = [\"x86_64-linux-gnu\", \"aarch64-linux-gnu\", \"aarch64-macos\", \"x86_64-macos\", \"x86_64-windows-gnu\", \"aarch64-windows-gnu\"]\n", "{case}/p/.toolchain/config/checks.toml" = "[[dup.exception]]\npaths = [\"docs/a.md\", \"docs/b.md\"]\nwhy = \"A reason.\"\n", "{case}/p/docs/a.md" = "# a\n\nOne two three four five six seven eight.\n", "{case}/p/docs/b.md" = "# b\n\nOne two three four five six seven eight.\n" }
claims = { status = 0, line = ["no fault in 2 documents"] }
false = { files = { "{case}/p/.toolchain/project.toml" = "[project]\ntargets = [\"x86_64-linux-gnu\", \"aarch64-linux-gnu\", \"aarch64-macos\", \"x86_64-macos\", \"x86_64-windows-gnu\", \"aarch64-windows-gnu\"]\n", "{case}/p/.toolchain/config/checks.toml" = "", "{case}/p/docs/c.md" = "# c\n\nOne two three four five six seven eight.\n" } }

