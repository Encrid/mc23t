[project]
name = "swept"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[[artifact]]
name = "swept"
kind = "program"
test = true
sources = ["src/*.c", "tests/*.c"]
include = ["src", "{toolchain}/runtime"]

[test]
timeout = 60
copies = 1
