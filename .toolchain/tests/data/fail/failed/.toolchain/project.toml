[project]
name = "failed"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
listed = "tests/fail.toml"
lists = "tests"

[fail]
with = ["{listed}"]

[[dependency]]
name = "door"
from = "{lists}"
list = "door.txt"
into = "{build}/taken/door"

[[artifact]]
name = "failed"
kind = "program"
sources = ["src/*.c", "tests/door.c"]
include = ["src"]

[test]
timeout = 60
copies = 1
