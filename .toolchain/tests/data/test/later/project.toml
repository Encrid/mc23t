[project]
name = "later"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[kinds.later]
output = "{name}.txt"
steps = [{ copy = ["{sources}", "{output}"] }]
unlinked = [{ copy = ["{sources}", "{work}.txt"] }]

[[artifact]]
name = "later"
kind = "later"
sources = [".toolchain/project.toml"]
link = ["{root}/linked.txt"]
