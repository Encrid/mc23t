[project]
name = "probe"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[[artifact]]
name = "probe"
kind = "wasm_module"
sources = ["src/*.c"]
include = ["src"]
link = ["{bb_wasm}/acc.wasm"]

[[artifact]]
name = "stand_in"
kind = "program"
test = true
sources = ["tests/stand_in.c"]
include = ["{toolchain}/runtime"]

[test]
timeout = 600
copies = 1
