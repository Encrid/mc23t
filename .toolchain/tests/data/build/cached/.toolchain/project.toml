[project]
name = "cached"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[kinds.cached]
output = "{name}.txt"
steps = [
    { run = ["{python}", "-c", "import os, pathlib; print(pathlib.Path(os.environ['ZIG_LOCAL_CACHE_DIR']).as_posix())"], cwd = "{build}" },
    { copy = ["{sources}", "{output}"] },
]

[[artifact]]
name = "cached"
kind = "cached"
test = true
sources = [".toolchain/project.toml"]
