[project]
name = "p"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
mark = "mark.py"

[kinds.silent]
output = "{name}.txt"
steps = [{ run = ["{python}", "-c", "print(1)"] }]

[[artifact]]
name = "note"
kind = "silent"
sources = ["note.txt"]
