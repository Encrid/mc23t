[project]
name = "p"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
mark = "mark.py"

[[artifact]]
name = "word.txt"
kind = "file"
sources = ["data/word.txt"]

[[artifact]]
name = "show"
kind = "program"
sources = ["src/show.c"]
inputs = ["{out}/word.txt"]
