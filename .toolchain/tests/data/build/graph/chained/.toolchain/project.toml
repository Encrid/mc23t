[project]
name = "p"

[variables]
mark = "mark.py"

[kinds.chained]
output = "{name}.bin"
steps = [
    { run = ["{python}", "-c", "import shutil, sys; shutil.copyfile(sys.argv[1], sys.argv[2])", "{sources}", "{work}.raw"] },
    { run = ["{python}", "-c", "import shutil, sys; shutil.copyfile(sys.argv[1], sys.argv[2])", "{work}.raw", "{output}"] },
    { section = "x", text = "y" },
]

[[artifact]]
name = "note"
kind = "chained"
sources = ["note.txt"]
