[project]
name = "copy"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
tool = "{python}"
source = ".toolchain/project.toml"
linked = ".toolchain/project.toml"

[tools]
interpreter = "{tool}"

[[artifact]]
name = "copy.txt"
kind = "file"
sources = ["{source}"]
link = ["{root}/{linked}"]
