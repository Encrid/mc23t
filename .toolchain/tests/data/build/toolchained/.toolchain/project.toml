[project]
name = "toolchained"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
place = "{toolchain}"

[kinds.taken]
output = "{name}.txt"
steps = [
    { copy = ["{place}/header.txt", "{work}.txt"] },
    { rename = ["{work}.txt", "{output}"] },
]

[[artifact]]
name = "notice"
kind = "taken"
sources = [".toolchain/project.toml"]
