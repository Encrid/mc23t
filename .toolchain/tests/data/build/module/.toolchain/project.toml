[project]
name = "module"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[module]
kind = "library"
folder = "built"
sources = ["src/{name}.c"]

[[modules]]
name = "mod"
path = true

[[modules]]
name = "two"
sources = ["src/two.c"]
path = true
defines = ["V=2"]
variants = [{ name = "three", defines = ["V=3"] }]

[[artifact]]
name = "pathcheck"
kind = "program"
sources = ["src/pathcheck.c"]
defines = ["{paths}"]
