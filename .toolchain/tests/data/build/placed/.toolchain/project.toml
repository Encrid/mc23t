[project]
name = "placed"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
side = "side"

[kinds.placed]
output = "{name}{exe}"
steps = [
    { run = ["{zig}", "cc", "-target", "{triple}", "-mcpu={cpu}", "{language}", "{include}", "{sources}", "side.c", "-o", "{output}"], cwd = "{side}" },
]

[[artifact]]
name = "placed"
kind = "placed"
sources = ["src/main.c"]
include = ["include"]
