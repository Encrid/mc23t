[project]
name = "leaky"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
stamp = "{root}"

[kinds.stamped]
output = "{name}.txt"
steps = [
    { copy = ["{sources}", "{work}.txt"] },
    { rename = ["{work}.txt", "{output}"] },
    { section = "said", text = "{manifest:,}" },
]

[[artifact]]
name = "stamped"
kind = "stamped"
sources = ["src/note.txt"]
manifest = ["{stamp}"]

[test]
timeout = 60
copies = 1
