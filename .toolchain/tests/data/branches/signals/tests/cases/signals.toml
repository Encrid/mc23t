[[case]]
name = "a write into an open pipe"
run = ["{out}/signals{exe}", "open"]
claims = { line = ["open write 0"] }
false = { run = ["{out}/signals{exe}"] }

[[case]]
name = "a write into a closed pipe takes the signal"
run = ["{out}/signals{exe}", "closed"]
claims = { line = ["closed write 12"] }
false = { run = ["{out}/signals{exe}", "open"] }

[[case]]
name = "a blocked signal pends although the program ignores it"
run = ["{out}/signals{exe}", "ignore"]
claims = { line = ["ignore write 12"] }
false = { run = ["{out}/signals{exe}", "open"] }

[[case]]
name = "a signal that waits already is left to the program"
run = ["{out}/signals{exe}", "pending"]
claims = { line = ["pending write -1"] }
false = { run = ["{out}/signals{exe}", "open"] }

[[case]]
name = "no argument"
run = ["{out}/signals{exe}"]
claims = { line = ["closed write 12"] }
false = { run = ["{out}/signals{exe}", "open"] }
