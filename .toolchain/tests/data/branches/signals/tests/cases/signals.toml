[[case]]
name = "a write into an open pipe"
run = ["{out}/signals{exe}", "open"]
claims = { line = ["open write 0"] }
alone = true
false = { run = ["{out}/signals{exe}"] }

[[case]]
name = "a write into a closed pipe"
run = ["{out}/signals{exe}", "closed"]
claims = { line = ["closed write -1"] }
alone = true
false = { run = ["{out}/signals{exe}", "open"] }

[[case]]
name = "a write into a closed pipe with the signal ignored"
run = ["{out}/signals{exe}", "ignore"]
claims = { line = ["ignore write -1"] }
alone = true
false = { run = ["{out}/signals{exe}", "closed"] }

[[case]]
name = "the variant form with the signal left pending"
run = ["{out}/signals{exe}", "closed", "variant"]
claims = { line = ["closed variant 0"] }
false = { run = ["{out}/signals{exe}", "ignore", "variant"] }

[[case]]
name = "the variant form with the signal ignored"
run = ["{out}/signals{exe}", "ignore", "variant"]
claims = { line = ["ignore variant 0"] }
false = { run = ["{out}/signals{exe}", "closed", "variant"] }

[[case]]
name = "the hoisted form with the signal left pending"
run = ["{out}/signals{exe}", "closed", "hoisted"]
claims = { line = ["closed hoisted 0"] }
false = { run = ["{out}/signals{exe}", "ignore", "hoisted"] }

[[case]]
name = "the hoisted form with the signal ignored"
run = ["{out}/signals{exe}", "ignore", "hoisted"]
claims = { line = ["ignore hoisted 0"] }
false = { run = ["{out}/signals{exe}", "closed", "hoisted"] }

[[case]]
name = "no argument"
run = ["{out}/signals{exe}"]
claims = { line = ["closed write -1"] }
alone = true
false = { run = ["{out}/signals{exe}", "open"] }
