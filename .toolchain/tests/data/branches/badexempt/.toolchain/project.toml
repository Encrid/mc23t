[project]
name = "badexempt"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[[artifact]]
name = "defend"
kind = "program"
sources = ["src/*.c"]
include = ["src"]

[[branches.exception]]
path = "src/defend.c"
line = 10
col = 9
side = "true"

[[branches.exception]]
path = "src/defend.c"
line = 12
col = 9
side = "true"
why = "This line holds no branch, so this exemption matches nothing."

[test]
timeout = 60
copies = 1
