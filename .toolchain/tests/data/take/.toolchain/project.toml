[project]
name = "taken"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
sample = "sample"
made = "sample"
maybe = "nothing"
pinned = "absent"

[[dependency]]
name = "sample"
from = "{root}/{sample}"
list = "package.txt"
into = "{build}/taken/sample"

[[dependency]]
name = "made"
make = ["{python}", "-c", "import shutil, sys; shutil.copytree(sys.argv[1], sys.argv[2], dirs_exist_ok=True)", "{root}/{made}", "{build}/made"]
from = "{build}/made"
list = "package.txt"
into = "{build}/taken/made"

[[dependency]]
name = "maybe"
from = "{root}/{maybe}"
list = "package.txt"
into = "{build}/taken/maybe"
optional = true

[[dependency]]
name = "pinned"
from = "{root}/{pinned}"
list = "{root}/pins.txt"
into = "{build}/taken/pinned"
optional = true

[[agree]]
keys = ["sample.package", "made.package", "maybe.package"]
length = 6
