[project]
name = "excused"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[[artifact]]
name = "keep"
kind = "program"
sources = ["src/*.c"]

[[leaks.exception]]
case = "kept"
kind = "memory"
why = "The case keeps one block on purpose, to check an exemption."

[test]
timeout = 60
copies = 1
