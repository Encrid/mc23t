[project]
name = "pointed"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[leaks.pairs]
open_thing = "close_thing"

[targets.x86_64-windows-gnu]

[targets.aarch64-windows-gnu]

[targets.x86_64-linux-gnu]

[targets.aarch64-linux-gnu]

[targets.x86_64-macos]

[targets.aarch64-macos]

[[artifact]]
name = "pointed"
kind = "program"
sources = ["src/*.c"]
include = ["src"]

[test]
timeout = 60
copies = 1
