[project]
name = "held"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[variables]
counted = "tests/leaks.toml"

[leaks]
with = ["{counted}"]

[leaks.kinds.note]
gives = { note_delete = 1 }

[[artifact]]
name = "held"
kind = "program"
sources = ["src/*.c", "tests/grab.c"]
include = ["src"]

[test]
timeout = 60
copies = 1
