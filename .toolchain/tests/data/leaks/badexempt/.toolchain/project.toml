[project]
name = "badexempt"
targets = ["x86_64-linux-gnu", "aarch64-linux-gnu", "aarch64-macos", "x86_64-macos", "x86_64-windows-gnu", "aarch64-windows-gnu"]

[[artifact]]
name = "keep"
kind = "program"
sources = ["src/*.c"]

[[leaks.exception]]
case = "kept"
kind = "memory"

[[leaks.exception]]
case = "kept"
kind = "nothing"
why = "No case keeps a resource of this kind, so this exemption excuses nothing."

[test]
timeout = 60
copies = 1
