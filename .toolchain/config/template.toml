[layout]
needed = [
    ".github/workflows/ci.yml", ".github/workflows/release.yml", ".github/workflows/cla.yml",
    ".github/workflows/warm.yml", ".gitattributes", ".gitignore", "cla.md", "license", "project.py",
    ".toolchain/project.toml", "readme.md", "docs/contributing/agreement.md",
    "docs/contributing/coding_style.md", "docs/contributing/coding_style_cxx.md",
    "docs/contributing/commits.md", "docs/contributing/decisions.md",
    "docs/contributing/documentation_style.md", "docs/contributing/needs.md",
    "docs/contributing/pull_request.md", "docs/contributing/tests.md",
]
allowed = [
    "architecture.md", ".github/workflows/toolchain.yml", "docs/**", "include/**/*.h",
    "include/**/*.hpp", "include/.gitkeep", "src/**", "tools/**", "tests/**", "third_party/**", ".toolchain/tools/*.py",
    ".toolchain/toolchain.toml", ".toolchain/config/**/*.toml", ".toolchain/header.txt",
    ".toolchain/graph.zig", ".toolchain/docs/*.md", ".toolchain/presets/*/*.toml", ".toolchain/presets/*/*.md",
    ".toolchain/runtime/*.c", ".toolchain/runtime/*.h",
]
made = ["*.o", "*.obj", "*.a", "*.so", "*.dll", "*.dylib", "*.exe", "*.gch", "*.d", "*.pyc", "*~", "#*#", "a.out"]
mirror = { include = "docs/extern", src = "docs/intern", tools = "docs/tools" }
